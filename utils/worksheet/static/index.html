<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worksheet</title>
<link rel="icon" href="/static/icon.ico">
<link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/static/vendor/prosemirror/prosemirror.css">
<link rel="stylesheet" href="/static/css/worksheet.css">
<!-- ProseMirror (the formatted editor of text regions) is vendored as the
     modules it is published as; they ask for each other by name. -->
<script type="importmap">
{ "imports": {
  "orderedmap": "/static/vendor/prosemirror/orderedmap.js",
  "rope-sequence": "/static/vendor/prosemirror/rope-sequence.js",
  "w3c-keyname": "/static/vendor/prosemirror/w3c-keyname.js",
  "prosemirror-model": "/static/vendor/prosemirror/prosemirror-model.js",
  "prosemirror-transform": "/static/vendor/prosemirror/prosemirror-transform.js",
  "prosemirror-state": "/static/vendor/prosemirror/prosemirror-state.js",
  "prosemirror-view": "/static/vendor/prosemirror/prosemirror-view.js",
  "prosemirror-commands": "/static/vendor/prosemirror/prosemirror-commands.js",
  "prosemirror-keymap": "/static/vendor/prosemirror/prosemirror-keymap.js",
  "prosemirror-history": "/static/vendor/prosemirror/prosemirror-history.js",
  "prosemirror-inputrules": "/static/vendor/prosemirror/prosemirror-inputrules.js",
  "prosemirror-schema-list": "/static/vendor/prosemirror/prosemirror-schema-list.js",
  "prosemirror-tables": "/static/vendor/prosemirror/prosemirror-tables.js"
} }
</script>
</head>
<body>

<header id="bar">
  <div class="menu" id="file-menu">
    <button class="menu-button" type="button" aria-haspopup="true">File</button>
    <div class="menu-list" hidden>
      <button type="button" data-cmd="new">New<kbd>Alt+N</kbd></button>
      <button type="button" data-cmd="open">Open…<kbd>Ctrl+O</kbd></button>
      <hr>
      <button type="button" data-cmd="save">Save<kbd>Ctrl+S</kbd></button>
      <button type="button" data-cmd="save-as">Save as…<kbd>Ctrl+Shift+S</kbd></button>
      <hr>
      <button type="button" data-cmd="page-frame">Header and footer…</button>
      <button type="button" data-cmd="print">Print…<kbd>Ctrl+P</kbd></button>
    </div>
  </div>
  <div class="menu" id="edit-menu">
    <button class="menu-button" type="button" aria-haspopup="true">Edit</button>
    <div class="menu-list" hidden>
      <button type="button" data-cmd="undo">Undo<kbd>Ctrl+Z</kbd></button>
      <button type="button" data-cmd="redo">Redo<kbd>Ctrl+Y</kbd></button>
      <hr>
      <button type="button" data-cmd="select-all">Select all<kbd>Ctrl+A</kbd></button>
      <button type="button" data-cmd="delete">Delete selection<kbd>Del</kbd></button>
      <hr>
      <button type="button" data-cmd="insert-space">Insert line at cursor<kbd>Ctrl+Enter</kbd></button>
      <button type="button" data-cmd="remove-space">Remove line at cursor<kbd>Ctrl+Backspace</kbd></button>
      <hr>
      <button type="button" data-cmd="take-values">Values from another sheet…</button>
    </div>
  </div>
  <div class="menu" id="arrange-menu">
    <button class="menu-button" type="button" aria-haspopup="true">Arrange</button>
    <div class="menu-list" hidden>
      <div class="menu-label">Align the selection by its</div>
      <button type="button" data-cmd="align-left">Left edges</button>
      <button type="button" data-cmd="align-centre">Centres</button>
      <button type="button" data-cmd="align-right">Right edges</button>
      <hr>
      <button type="button" data-cmd="align-top">Tops</button>
      <button type="button" data-cmd="align-middle">Middles</button>
      <button type="button" data-cmd="align-bottom">Bottoms</button>
      <hr>
      <div class="menu-label">Space it out evenly</div>
      <button type="button" data-cmd="spread-across">Across</button>
      <button type="button" data-cmd="spread-down">Down</button>
      <hr>
      <button type="button" data-cmd="split">Split region into statements</button>
    </div>
  </div>
  <div class="menu" id="view-menu">
    <button class="menu-button" type="button" aria-haspopup="true">View</button>
    <div class="menu-list" hidden>
      <div class="menu-label">Show results</div>
      <button type="button" data-cmd="results-auto" role="menuitemradio">Calculated values</button>
      <button type="button" data-cmd="results-all" role="menuitemradio">Every definition</button>
      <button type="button" data-cmd="results-explicit" role="menuitemradio">Only where asked</button>
      <hr>
      <button type="button" data-cmd="toggle-grid" role="menuitemcheckbox">Grid</button>
      <button type="button" data-cmd="toggle-markdown" role="menuitemcheckbox">Write text as Markdown</button>
      <button type="button" data-cmd="toggle-palette" role="menuitemcheckbox">Symbols<kbd>F2</kbd></button>
      <button type="button" data-cmd="search-symbols">Search symbols and functions<kbd>Ctrl+E</kbd></button>
      <hr>
      <button type="button" data-cmd="zoom-in">Zoom in<kbd>Ctrl +</kbd></button>
      <button type="button" data-cmd="zoom-out">Zoom out<kbd>Ctrl −</kbd></button>
      <button type="button" data-cmd="zoom-reset">Actual size<kbd>Ctrl+0</kbd></button>
    </div>
  </div>
  <div class="menu" id="calc-menu">
    <button class="menu-button" type="button" aria-haspopup="true">Calculate</button>
    <div class="menu-list" hidden>
      <button type="button" data-cmd="calc">Calculate<kbd>F9</kbd></button>
      <button type="button" data-cmd="calc-all">Recalculate everything<kbd>Ctrl+F9</kbd></button>
      <button type="button" data-cmd="stop-menu">Stop<kbd>Esc</kbd></button>
      <hr>
      <button type="button" data-cmd="restart">Restart the kernel</button>
    </div>
  </div>
  <div class="menu" id="help-menu">
    <button class="menu-button" type="button" aria-haspopup="true">Help</button>
    <div class="menu-list" hidden>
      <button type="button" data-cmd="help">Keys and notation<kbd>F1</kbd></button>
    </div>
  </div>

  <div class="sep"></div>
  <button class="tool" type="button" data-cmd="calc" title="Calculate what is out of date (F9) — Ctrl+F9 recalculates everything">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg><span>Calculate</span>
  </button>
  <button class="tool" type="button" data-cmd="stop" title="Stop the calculation (Esc)" disabled>
    <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="1"/></svg><span>Stop</span>
  </button>
  <label class="tool check" title="Recalculate whenever something changes">
    <input type="checkbox" id="auto-calc" checked><span>Automatic</span>
  </label>
  <div class="sep"></div>
  <button class="tool" type="button" data-cmd="insert-math" title="New math region at the cursor — or just start typing">
    <span class="glyph">x=</span><span>Math</span>
  </button>
  <button class="tool" type="button" data-cmd="insert-text" title='New text region at the cursor (")'>
    <span class="glyph">T</span><span>Text</span>
  </button>
  <button class="tool" type="button" data-cmd="insert-picture" title="A picture from a file, at the cursor — or paste one (Ctrl+V), or drop its file on the page">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M2 3h12v10H2zM3 4v6.3l3-3 2.5 2.5L11 7.3l2 2V4zM5.2 5.1a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4z"/></svg><span>Picture</span>
  </button>
  <button class="tool" type="button" data-cmd="take-values" title="Values from another sheet, at the cursor: what its variables were when it was saved">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M6 1.5h8.5v13H6V11h1v2.5h6.5v-11H7V5H6zM1 7.5h7.2L6.4 5.7l.7-.7L10.1 8l-3 3-.7-.7 1.8-1.8H1z"/></svg><span>Values</span>
  </button>
  <button class="tool" type="button" data-cmd="toggle-palette" title="Symbols, functions and units (F2) — Ctrl+E searches them">
    <span class="glyph">Ω</span><span>Symbols</span>
  </button>
  <div class="sep"></div>
  <div id="arrange" role="group" aria-label="Arrange the selected regions">
    <button class="tool icon" type="button" data-cmd="align-left" title="Align left edges — one region: to the left of the page" disabled>
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1" width="1" height="14"/><rect x="4" y="3.5" width="9.5" height="3.5"/><rect x="4" y="9" width="6" height="3.5"/></svg>
    </button>
    <button class="tool icon" type="button" data-cmd="align-centre" title="Align centres — one region: centre it on the page" disabled>
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="7.5" y="1" width="1" height="14"/><rect x="2.5" y="3.5" width="11" height="3.5"/><rect x="4.5" y="9" width="7" height="3.5"/></svg>
    </button>
    <button class="tool icon" type="button" data-cmd="align-right" title="Align right edges — one region: to the right of the page" disabled>
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="13.5" y="1" width="1" height="14"/><rect x="2.5" y="3.5" width="9.5" height="3.5"/><rect x="6" y="9" width="6" height="3.5"/></svg>
    </button>
    <button class="tool icon" type="button" data-cmd="align-top" title="Align tops" disabled>
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1.5" width="14" height="1"/><rect x="3.5" y="4" width="3.5" height="9.5"/><rect x="9" y="4" width="3.5" height="6"/></svg>
    </button>
    <button class="tool icon" type="button" data-cmd="align-middle" title="Align middles" disabled>
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="7.5" width="14" height="1"/><rect x="3.5" y="2.5" width="3.5" height="11"/><rect x="9" y="4.5" width="3.5" height="7"/></svg>
    </button>
    <button class="tool icon" type="button" data-cmd="align-bottom" title="Align bottoms" disabled>
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="13.5" width="14" height="1"/><rect x="3.5" y="2.5" width="3.5" height="9.5"/><rect x="9" y="6" width="3.5" height="6"/></svg>
    </button>
    <button class="tool icon" type="button" data-cmd="spread-across" title="Space out evenly across (three regions or more)" disabled>
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="1" height="14"/><rect x="14" y="1" width="1" height="14"/><rect x="4" y="4" width="3" height="8"/><rect x="9" y="4" width="3" height="8"/></svg>
    </button>
    <button class="tool icon" type="button" data-cmd="spread-down" title="Space out evenly down (three regions or more)" disabled>
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="14" height="1"/><rect x="1" y="14" width="14" height="1"/><rect x="4" y="4" width="8" height="3"/><rect x="4" y="9" width="8" height="3"/></svg>
    </button>
  </div>

  <div class="grow"></div>
  <div id="doc-title" title=""><span id="doc-name">Untitled</span><span id="doc-dirty" hidden> •</span></div>
  <div class="grow"></div>
  <div id="status" title=""><span id="status-dot"></span><span id="status-text">Starting…</span></div>
</header>

<div id="banner" hidden></div>

<div id="work">
  <main id="desk" tabindex="-1">
    <div id="paper">
      <div id="content">
        <div id="cross" hidden></div>
        <div id="band" hidden></div>
        <textarea id="sink" aria-label="Worksheet input" autocomplete="off" autocapitalize="off"
                  spellcheck="false" rows="1"></textarea>
      </div>
    </div>
  </main>
  <aside id="palette" hidden aria-label="Symbols"></aside>
</div>

<div id="overlay" hidden></div>
<div id="toast" hidden></div>
<input type="file" id="picture-file" multiple hidden
       accept="image/png,image/jpeg,image/gif,image/webp,image/bmp,image/svg+xml,.svg">

<script src="/static/vendor/katex/katex.min.js"></script>
<script type="module" src="/static/js/main.js"></script>
</body>
</html>
